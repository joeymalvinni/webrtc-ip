name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  package:
    name: Package tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit
      - name: Test
        run: npm test
      - name: Verify generated dist is current
        run: git diff --exit-code dist
      - name: Benchmark smoke test
        run: npm run benchmark -- 20
      - name: Pack dry run
        run: npm pack --dry-run
      - name: CommonJS export smoke test
        run: node -e "const pkg = require('.'); if (typeof pkg.getIP !== 'function') throw new Error('missing getIP export');"
      - name: ESM export smoke test
        run: node --input-type=module -e "import { getIP } from 'webrtc-ip'; if (typeof getIP !== 'function') throw new Error('missing getIP export');"

  website:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: website
      - name: Audit dependencies
        run: npm audit
        working-directory: website
      - name: Lint website
        run: npm run lint
        working-directory: website
      - name: Build website
        run: npm run build
        working-directory: website
